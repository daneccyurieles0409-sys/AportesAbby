<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ideas para la llegada de Abby</title>
<style>
:root{--bg:#faf3e3;--card:#fffdf6;--ink:#3b3326;--muted:#7a6d58;--accent:#a9780f;--soft:#f6e6b0}
@media (prefers-color-scheme:dark){:root{--bg:#1f1b12;--card:#2b2518;--ink:#f6efdc;--muted:#c4b898;--accent:#e8c45a;--soft:#3b3220;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 48px}
header{text-align:center;padding:12px 0 18px}
h1{font-size:32px;margin:6px 0 10px;font-weight:600}
header p{margin:0 auto;max-width:520px;color:var(--muted)}
.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0;border:1px solid var(--soft)}
.card h2{margin:0 0 8px;font-size:20px;color:var(--accent);font-weight:600}
label.it{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer}
label.it input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:none}
label.it small{display:block;color:var(--muted);font-size:13px;font-family:system-ui,sans-serif;line-height:1.3}
label.it.taken{opacity:.5;cursor:default}
label.it.taken span::after{content:" · ya reservado";font-size:13px;font-family:system-ui,sans-serif;color:var(--accent)}
.form input[type=text],.form textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid var(--soft);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.form label{font-family:system-ui,sans-serif;font-size:14px;color:var(--muted)}
button{width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:600 17px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
#msg{text-align:center;margin-top:12px;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Ideas para la llegada de Abby 🍼</h1>
<p>Algunas ideas de cosas útiles para recibirla. Los detalles son solo una guía: cualquier opción parecida será recibida con mucho cariño. Marca lo que quieras aportar y envía el formulario al final.</p>
</header>
<div id="list"></div>
<section class="card form">
<h2>Tus datos</h2>
<label for="n">Tu nombre *</label>
<input type="text" id="n" maxlength="80">
<label for="c">WhatsApp o contacto (opcional)</label>
<input type="text" id="c" maxlength="80">
<label for="m">Mensaje (opcional)</label>
<textarea id="m" rows="3" maxlength="300"></textarea>
<button id="send">Enviar mi aporte</button>
<div id="msg"></div>
</section>
</div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbymh16d6_D046NtpzKGBg-2RRlKyGgxTOd1dQNH05dS0VVcFxVjuD7dhitWF_e2v38/exec';
const DATA=[
['Pañales y cuidado diario',[['Paquetes de pañales por talla','Hipoalergénicos · RN, P/S, M y G',1],['Pañitos húmedos','99.9% agua, sin olor, hipoalergénicos',1],['Crema antipañalitis','Marca Almipro, para pieles delicadas'],['Jabón y shampoo para bebé','Jabón Almipro o Dove Baby, shampoo suave'],['Algodón'],['Kit de aseo']]],
['Hora de comer',[['Teteros','En tres tamaños: pequeño, mediano y grande'],['Esterilizador de teteros','O una olla de acero inoxidable'],['Extractor de leche'],['Cojín de lactancia'],['Paños de tela y baberos']]],
['Dormir y bañarse',[['Cuna corral'],['Sábanas para corral'],['Protector de colchón impermeable'],['Toldo mosquitero'],['Bañera plegable'],['Toalla de baño para bebé'],['Tendedero plegable']]],
['Para pasear y descansar',[['Coche'],['Sillita mecedora o columpio'],['Fular portabebé'],['Pañalera'],['Termómetro']]],
['Para mamá 💛',[['Toallas posparto'],['Brasier de lactancia','Escríbeme para la talla'],['Protectores de lactancia'],['Pantis de algodón'],['Pijamas cómodas'],['Pantuflas']]],
['Otra forma de ayudar',[['Aporte en dinero','Te escribo para darte los datos',1]]]
];
const list=document.getElementById('list');
DATA.forEach(([title,items])=>{
  const s=document.createElement('section');s.className='card';
  const h=document.createElement('h2');h.textContent=title;s.appendChild(h);
  items.forEach(([name,det,multi])=>{
    const l=document.createElement('label');l.className='it';l.dataset.name=name;if(multi)l.dataset.multi='1';
    const cb=document.createElement('input');cb.type='checkbox';cb.value=name;
    const d=document.createElement('div');const sp=document.createElement('span');sp.textContent=name;d.appendChild(sp);
    if(det){const sm=document.createElement('small');sm.textContent=det;d.appendChild(sm)}
    l.append(cb,d);s.appendChild(l);
  });
  list.appendChild(s);
});
function markTaken(names){
  document.querySelectorAll('label.it').forEach(l=>{
    if(!l.dataset.multi&&names.includes(l.dataset.name)){l.classList.add('taken');const cb=l.querySelector('input');cb.checked=false;cb.disabled=true}
  });
}
if(!SCRIPT_URL.startsWith('PEGA')){
  fetch(SCRIPT_URL).then(r=>r.json()).then(j=>markTaken(j.taken||[])).catch(()=>{});
}
const msg=document.getElementById('msg'),btn=document.getElementById('send');
btn.onclick=async()=>{
  const nombre=document.getElementById('n').value.trim();
  const items=[...document.querySelectorAll('label.it input:checked')].map(i=>i.value);
  if(!nombre){msg.textContent='Escribe tu nombre, por favor.';return}
  if(!items.length){msg.textContent='Marca al menos una opción.';return}
  if(SCRIPT_URL.startsWith('PEGA')){msg.textContent='Falta conectar la hoja de cálculo.';return}
  btn.disabled=true;msg.textContent='Enviando...';
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({nombre,items,contacto:document.getElementById('c').value.trim(),mensaje:document.getElementById('m').value.trim()})});
    markTaken(items);
    msg.textContent='¡Gracias, '+nombre+'! Tu aporte quedó registrado 💛';
  }catch(e){msg.textContent='No se pudo enviar. Intenta de nuevo.';btn.disabled=false}
};
</script>
</body>
</html>
